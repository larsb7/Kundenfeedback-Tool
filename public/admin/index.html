<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Terminanfragen</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="brand">
    <div class="brand-name">Lars Beeler</div>
    <div class="brand-role">Admin-Bereich Terminanfragen</div>
  </div>

  <!-- Login -->
  <div class="card login-card" id="loginCard">
    <h1>Anmelden</h1>
    <div id="loginError" class="form-error" style="display: none"></div>
    <div class="field">
      <label for="passwordInput">Passwort</label>
      <input type="password" id="passwordInput" />
    </div>
    <div class="actions">
      <span></span>
      <button type="button" class="primary" id="loginBtn">Anmelden</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="admin-wrap" id="dashboard" style="display: none">
    <div class="admin-header">
      <h1 style="margin: 0">Übersicht</h1>
      <button type="button" class="secondary" id="logoutBtn">Abmelden</button>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="overview">Übersicht</button>
      <button type="button" class="tab-btn" data-tab="leads">Terminanfragen</button>
    </div>

    <div class="filter-row">
      <div class="field">
        <label for="filterFrom">Von</label>
        <input type="date" id="filterFrom" />
      </div>
      <div class="field">
        <label for="filterTo">Bis</label>
        <input type="date" id="filterTo" />
      </div>
      <div class="field" id="filterStatusWrap" style="display: none">
        <label for="filterStatus">Status</label>
        <select id="filterStatus">
          <option value="">Alle</option>
          <option value="neu">Neu</option>
          <option value="kontaktiert">Kontaktiert</option>
          <option value="termin_vereinbart">Termin vereinbart</option>
          <option value="abgeschlossen">Abgeschlossen</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="button" class="secondary" id="applyFiltersBtn">Filtern</button>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="button" class="link-btn" id="resetFiltersBtn">Zurücksetzen</button>
      </div>
    </div>

    <!-- Übersicht -->
    <div class="tab-panel active" data-panel="overview">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-value" id="statTotal">–</div>
          <div class="stat-label">Anfragen gesamt</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statNeu">–</div>
          <div class="stat-label">Neu</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statKontaktiert">–</div>
          <div class="stat-label">Kontaktiert</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statTermin">–</div>
          <div class="stat-label">Termin vereinbart</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statAbgeschlossen">–</div>
          <div class="stat-label">Abgeschlossen</div>
        </div>
      </div>

      <h2 style="font-size: 1rem">Verlauf über Zeit</h2>
      <div id="verlaufContainer"></div>
    </div>

    <!-- Terminanfragen -->
    <div class="tab-panel" data-panel="leads">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Name</th>
              <th>Telefon</th>
              <th>E-Mail</th>
              <th>Thema</th>
              <th>Empfohlen durch</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="leadsBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="leadsEmpty" style="display: none">Keine Terminanfragen gefunden.</div>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
